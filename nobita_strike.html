<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Nobita Strike</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#04010c;overflow:hidden;touch-action:none;font-family:'Orbitron','Segoe UI',sans-serif;color:#fff}
canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,10,.75) 100%)}
#flash{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 30%,rgba(255,30,60,.9));opacity:0}
#sc{position:absolute;left:18px;top:12px;font-size:26px;color:#0ff;text-shadow:0 0 12px #0ff,0 0 28px #08f}
#bs{position:absolute;right:18px;top:16px;font-size:14px;color:#f8f;text-shadow:0 0 10px #f0f}
#hp{position:absolute;right:18px;top:44px;display:flex;gap:5px}
#hp i{width:26px;height:8px;border-radius:2px;background:#222;border:1px solid #555}
#hp i.on{background:#0f8;border-color:#0f8;box-shadow:0 0 10px #0f8}
#msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:38px;color:#0ff;text-align:center;text-shadow:0 0 16px #0ff,0 0 40px #08f}
#msg small{font-size:15px;color:#fff;margin-top:12px;text-shadow:0 0 8px #fff;letter-spacing:3px}
#boss{position:absolute;left:12%;right:12%;top:80px;height:10px;border:1px solid #f35;border-radius:5px;display:none;box-shadow:0 0 14px #f35;background:#200}
#bf{display:block;height:100%;width:100%;background:linear-gradient(90deg,#f26,#f90);border-radius:4px}
#tip{position:absolute;left:0;right:0;bottom:16%;text-align:center;font-size:18px;color:#ff0;text-shadow:0 0 12px #ff0;opacity:0;letter-spacing:3px}
#hud{display:none}
#splash,#ld{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .6s}
#splash{z-index:30}#ld{z-index:25;display:none}
#logo{width:140px;border-radius:14px;box-shadow:0 0 28px #08f,0 0 70px #037;animation:pop 1.3s ease-out both}
#cb{margin-top:24px;font-size:14px;letter-spacing:5px;color:#9cf;text-shadow:0 0 10px #08f;animation:pop 1.8s ease-out both}
@keyframes pop{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:none}}
#lbar{width:220px;height:5px;background:#112;border-radius:3px;overflow:hidden}
#lb{height:100%;background:linear-gradient(90deg,#08f,#0ff);transform-origin:left;animation:fill 2.3s ease-out forwards;box-shadow:0 0 10px #0ff}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
#lt{margin-top:16px;font-size:12px;letter-spacing:4px;color:#7cf;text-align:center;padding:0 20px}
#menu{position:fixed;inset:0;z-index:15;display:none;flex-direction:column;justify-content:flex-end;background:linear-gradient(rgba(0,0,10,0) 30%,rgba(0,0,12,.88) 62%)}
#mtop{position:absolute;top:14px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:center;font-size:14px;letter-spacing:3px;color:#0ff;text-shadow:0 0 10px #0ff}
#mmoney{color:#ffd23f;text-shadow:0 0 10px #fa0;font-size:20px}
#info{padding:0 18px}
#pn{margin:0;font-size:26px;color:#fff;text-shadow:0 0 14px #0ff}
#pd{margin:4px 0 10px;font-size:12px;color:#9bd;font-family:sans-serif}
.st{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:10px;color:#8ab}
.st i{width:86px;font-style:normal}
.st u{flex:1;height:6px;background:#112;border-radius:3px;overflow:hidden;text-decoration:none}
.st s{display:block;height:100%;background:linear-gradient(90deg,#08f,#0ff);text-decoration:none;transition:width .3s}
#cards{display:flex;gap:6px;padding:12px 10px 8px}
.card{flex:1;min-width:0;text-align:center;padding:10px 2px;border:1px solid #234;border-radius:10px;background:rgba(10,20,50,.7);font-size:10px;color:#fff}
.card b{display:block;font-size:10px}
.card span{display:block;margin-top:4px;color:#7cf;font-size:9px;font-family:sans-serif}
.card.sel{border-color:#0ff;box-shadow:0 0 14px #0ff}
.card.lock span{color:#ffd23f}.card.lock b{opacity:.6}
#go{margin:6px 18px 24px;padding:16px;font:bold 20px 'Orbitron',sans-serif;letter-spacing:4px;border:2px solid #0ff;border-radius:12px;background:rgba(0,200,255,.15);color:#0ff;text-shadow:0 0 10px #0ff;box-shadow:0 0 18px #08f}
#go.buy{border-color:#ffd23f;color:#ffd23f;background:rgba(255,200,0,.14);box-shadow:0 0 18px #fa0;text-shadow:0 0 10px #fa0}
#go.dim{border-color:#555;color:#888;box-shadow:none;text-shadow:none;background:#111}
#mn{position:absolute;left:18px;top:46px;font-size:15px;color:#ffd23f;text-shadow:0 0 8px #fa0}
</style></head><body>

<script>
const $=id=>document.getElementById(id),R=(a,b)=>Math.random()*(b-a)+a;
const CDN='https://cdn.jsdelivr.net/npm/three@0.128.0/';
const FILES=['build/three.min.js','examples/js/shaders/CopyShader.js','examples/js/shaders/LuminosityHighPassShader.js','examples/js/postprocessing/EffectComposer.js','examples/js/postprocessing/MaskPass.js','examples/js/postprocessing/RenderPass.js','examples/js/postprocessing/ShaderPass.js','examples/js/postprocessing/UnrealBloomPass.js'];
(async()=>{
  for(const f of FILES)await new Promise(r=>{
    const s=document.createElement('script');s.src='lib/'+f.split('/').pop();
    s.onload=r;s.onerror=()=>{const u=document.createElement('script');u.src=CDN+f;u.onload=r;u.onerror=r;document.head.appendChild(u)};
    document.head.appendChild(s)});
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  await sleep(Math.max(0,3300-performance.now()));
  $('splash').style.opacity=0;$('ld').style.display='flex';await sleep(650);$('splash').style.display='none';
  if(!window.THREE){$('lt').textContent='Three.js load nahi hua - lib folder ya internet check karo';return}
  const tl=performance.now();await sleep(60);
  try{start()}catch(e){$('lt').textContent='Error: '+e.message;return}
  await sleep(Math.max(0,2400-(performance.now()-tl)));
  $('ld').style.opacity=0;await sleep(650);$('ld').style.display='none';window.openMenu&&window.openMenu();
})();

function start(){
$('msg').innerHTML='';
const ren=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});
ren.setPixelRatio(Math.min(devicePixelRatio,1.5));ren.setSize(innerWidth,innerHeight);document.body.prepend(ren.domElement);
const scene=new THREE.Scene();scene.fog=new THREE.Fog(0x0a0620,90,300);
const cam=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,330);
scene.add(new THREE.AmbientLight(0x8866cc,.9));
const dl=new THREE.DirectionalLight(0xffffff,1.1);dl.position.set(5,10,8);scene.add(dl);
const dl2=new THREE.DirectionalLight(0x4466ff,.5);dl2.position.set(-6,-3,-8);scene.add(dl2);

// bloom
let comp=null,bloom=null;
if(THREE.EffectComposer&&THREE.UnrealBloomPass){
  comp=new THREE.EffectComposer(ren);comp.addPass(new THREE.RenderPass(scene,cam));
  bloom=new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.55,.5,.6);comp.addPass(bloom)}
addEventListener('resize',()=>{ren.setSize(innerWidth,innerHeight);if(comp)comp.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()});

// glow sprites
const gc=document.createElement('canvas');gc.width=gc.height=64;const gx=gc.getContext('2d');
const gg=gx.createRadialGradient(32,32,0,32,32,32);
gg.addColorStop(0,'rgba(255,255,255,1)');gg.addColorStop(.3,'rgba(255,255,255,.45)');gg.addColorStop(1,'rgba(255,255,255,0)');
gx.fillStyle=gg;gx.fillRect(0,0,64,64);
const gtex=new THREE.CanvasTexture(gc),smat={};
const spr=col=>smat[col]||(smat[col]=new THREE.SpriteMaterial({map:gtex,color:col,blending:THREE.AdditiveBlending,depthWrite:false,transparent:true}));
function glow(col,s){const m=new THREE.Sprite(spr(col));m.scale.set(s,s,1);return m}
function part(g,m,p,r,edge){const o=new THREE.Mesh(g,m);o.position.set(p[0],p[1],p[2]);if(r)o.rotation.set(r[0],r[1],r[2]);
  if(edge!==undefined)o.add(new THREE.LineSegments(new THREE.EdgesGeometry(g),new THREE.LineBasicMaterial({color:edge})));return o}

// nebula sky
const nc=document.createElement('canvas');nc.width=1024;nc.height=512;const nx=nc.getContext('2d');
nx.fillStyle='#04010c';nx.fillRect(0,0,1024,512);
const ncols=['60,70,200','40,140,200','40,120,255','70,50,170'];
for(let i=0;i<70;i++){const cx=R(0,1024),cy=R(60,450),r=R(60,230),c=ncols[i%4],g=nx.createRadialGradient(cx,cy,0,cx,cy,r);
  g.addColorStop(0,`rgba(${c},.17)`);g.addColorStop(1,`rgba(${c},0)`);nx.fillStyle=g;nx.fillRect(cx-r,cy-r,r*2,r*2)}
for(let i=0;i<800;i++){nx.fillStyle=`rgba(255,255,255,${R(.2,.9)})`;nx.fillRect(R(0,1024),R(0,512),R(.5,1.8),R(.5,1.8))}
const sky=new THREE.Mesh(new THREE.SphereGeometry(290,32,16),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(nc),side:THREE.BackSide,fog:false,depthWrite:false}));
sky.renderOrder=-2;scene.add(sky);
try{const et=new THREE.CanvasTexture(nc);et.mapping=THREE.EquirectangularReflectionMapping;const pm=new THREE.PMREMGenerator(ren);scene.environment=pm.fromEquirectangular(et).texture;pm.dispose();et.dispose()}catch(e){}

// synthwave sun
const sun=new THREE.Mesh(new THREE.CircleGeometry(42,48),new THREE.ShaderMaterial({transparent:true,
  vertexShader:'varying vec2 v;void main(){v=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:'varying vec2 v;void main(){vec2 p=v-.5;if(length(p)>.5)discard;float y=v.y;if(y<.46&&mod(y*34.,2.)<(.46-y)*4.4)discard;gl_FragColor=vec4(mix(vec3(1.,.15,.55),vec3(1.,.9,.25),y),1.);}'}));
sun.position.set(0,12,-270);scene.add(sun);
const sunG=new THREE.Sprite(new THREE.SpriteMaterial({map:gtex,color:0x882244,blending:THREE.AdditiveBlending,depthWrite:false,transparent:true,fog:false}));
sunG.scale.set(110,110,1);sunG.position.set(0,12,-272);scene.add(sunG);
function ptex(pal,n){const c=document.createElement('canvas');c.width=512;c.height=256;const x=c.getContext('2d');
  x.fillStyle=pal[0];x.fillRect(0,0,512,256);
  for(let i=0;i<n*3;i++){x.fillStyle=pal[i%pal.length];x.globalAlpha=R(.15,.5);const y=R(0,256),h=R(3,26);x.fillRect(0,y,512,h);
    x.beginPath();x.ellipse(R(0,512),y,R(20,90),h*.7,0,0,6.3);x.fill()}
  x.globalAlpha=1;return new THREE.CanvasTexture(c)}
const planets=[];
function planet(px,py,pz,r,pal,n,halo,ring){const g=new THREE.Group(),m=new THREE.Mesh(new THREE.SphereGeometry(r,48,32),new THREE.MeshStandardMaterial({map:ptex(pal,n),roughness:.9,metalness:0,fog:false}));
  g.add(m);
  g.add(new THREE.Mesh(new THREE.SphereGeometry(r*1.07,32,24),new THREE.MeshBasicMaterial({color:halo,side:THREE.BackSide,transparent:true,opacity:.35,blending:THREE.AdditiveBlending,depthWrite:false,fog:false})));
  const h=new THREE.Sprite(new THREE.SpriteMaterial({map:gtex,color:halo,blending:THREE.AdditiveBlending,depthWrite:false,transparent:true,fog:false,opacity:.5}));
  h.scale.set(r*4.2,r*4.2,1);h.position.z=-r*.3;g.add(h);
  if(ring){const rg=new THREE.Mesh(new THREE.RingGeometry(r*1.35,r*2.3,80),new THREE.MeshBasicMaterial({color:ring,transparent:true,opacity:.55,side:THREE.DoubleSide,fog:false,depthWrite:false}));rg.rotation.x=1.25;rg.rotation.y=.25;g.add(rg)}
  g.position.set(px,py,pz);scene.add(g);planets.push(m)}
planet(-75,28,-235,40,['#c77b3a','#e8b27a','#8a4b25','#f2d3a5'],46,0xffaa55,0xd8b88a);
planet(88,-6,-205,17,['#0b3d91','#1f7a3a','#2f9fd8','#e8f4ff'],38,0x55aaff);
planet(30,36,-260,9,['#7a1a0a','#ff5a1f','#2a0600','#ffb347'],30,0xff5522);


// stars, grid, tunnel rings
const N=1500,sp=new Float32Array(N*3);
for(let i=0;i<N;i++){sp[i*3]=R(-80,80);sp[i*3+1]=R(-50,50);sp[i*3+2]=R(-200,10)}
const sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.BufferAttribute(sp,3));
scene.add(new THREE.Points(sg,new THREE.PointsMaterial({color:0xffffff,size:.4,transparent:true,opacity:.9})));
const grid=new THREE.GridHelper(300,60,0x3366ff,0x2a2a99);grid.position.y=-9;scene.add(grid);
const tun=[];for(let i=0;i<10;i++){const r=new THREE.Mesh(new THREE.TorusGeometry(22,.15,6,56),new THREE.MeshBasicMaterial({color:i%2?0x00b8d4:0x3a4acc}));
  r.position.set(0,2,-i*20);scene.add(r);tun.push(r)}

// player ship (selectable planes)
const PL=[
{n:'FALCON',cost:0,c:0x2a3a70,a:0x00e5ff,hp:3,cd:.16,dm:1,w0:0,sp:10,w:2.8,d:'Balanced starter fighter'},
{n:'VIPER',cost:600,c:0x3a1a1a,a:0xff3b3b,hp:3,cd:.11,dm:1,w0:0,sp:14,w:2.2,d:'Very fast fire, razor agile'},
{n:'TITAN',cost:1500,c:0x2f3a2a,a:0xffb020,hp:5,cd:.17,dm:2,w0:0,sp:8,w:3.4,d:'Heavy armor, hard hitting'},
{n:'PHANTOM',cost:3000,c:0x1a1a2a,a:0xb06bff,hp:4,cd:.12,dm:1,w0:1,sp:13,w:3,d:'Starts with spread shot'},
{n:'NOVA',cost:6000,c:0xd8e0ff,a:0x44ff99,hp:5,cd:.1,dm:2,w0:1,sp:12,w:3.2,d:'Elite: spread shot + shield start'}];
let money=0,owned=[0],sel=0,cur=PL[0],st=2;
try{money=+localStorage.getItem('nsh_money')||0;owned=JSON.parse(localStorage.getItem('nsh_own')||'[0]')}catch(e){}
function save(){try{localStorage.setItem('nsh_money',money);localStorage.setItem('nsh_own',JSON.stringify(owned))}catch(e){}}
const ship=new THREE.Group(),hull=new THREE.Group(),flames=[];ship.add(hull);
const pl=new THREE.PointLight(0x00ffff,1.6,24);pl.position.z=2.5;ship.add(pl);
function buildShip(d){
  while(hull.children.length)hull.remove(hull.children[0]);flames.length=0;
  const hm=new THREE.MeshStandardMaterial({color:d.c,emissive:d.c,emissiveIntensity:.25,metalness:.9,roughness:.28,flatShading:true}),
  am=new THREE.MeshStandardMaterial({color:d.a,emissive:d.a,emissiveIntensity:.9,flatShading:true}),w=d.w;
  hull.add(part(new THREE.ConeGeometry(.65,3.8,6),hm,[0,0,-.1],[-Math.PI/2,0,0],d.a));
  hull.add(part(new THREE.BoxGeometry(w,.1,1.5),hm,[-w*.6,0,.6],[0,.35,.18],d.a));
  hull.add(part(new THREE.BoxGeometry(w,.1,1.5),hm,[w*.6,0,.6],[0,-.35,-.18],d.a));
  hull.add(part(new THREE.BoxGeometry(.14,.7,1.4),am,[-w*1.07,.1,.9],[0,0,0]));
  hull.add(part(new THREE.BoxGeometry(.14,.7,1.4),am,[w*1.07,.1,.9],[0,0,0]));
  hull.add(part(new THREE.BoxGeometry(.12,.9,1.1),hm,[0,.55,1],null,d.a));
  const ck=new THREE.Mesh(new THREE.SphereGeometry(.38,14,10),new THREE.MeshStandardMaterial({color:0x88ffff,emissive:0x00aadd,emissiveIntensity:.8,transparent:true,opacity:.9}));

  planets.forEach(m=>m.rotation.y+=dt*.03);if(st==3){if(!over)play(dt)}else menuAnim(dt);
  for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.l-=dt;
    if(q.l<=0){scene.remove(q.o);if(q.wave){q.o.material.dispose();q.o.geometry.dispose()}parts.splice(i,1);continue}
    const f=q.l/q.m;
    if(q.wave){q.o.scale.setScalar(1+(1-f)*q.s);q.o.material.opacity=f}
    else{q.o.position.addScaledVector(q.v,dt);if(q.rot){q.o.rotation.x+=q.rot*dt;q.o.rotation.y+=q.rot*.7*dt}q.o.scale.setScalar(q.grow?q.s*(1.5-f*.7)*Math.min(1,f*4):q.s*f)}}
  const P=ship.position;
  sky.position.copy(cam.position);sky.rotation.y+=dt*.004;
  if(st==3){cam.position.set(P.x*.45+R(-1,1)*shake,2.5+P.y*.3+R(-1,1)*shake,13);cam.lookAt(P.x*.3,P.y*.2,-20);cam.rotateZ((tx-P.x)*.012)}else{cam.position.set(0,1.2,10.5);cam.lookAt(0,-1.4,0)}
  cam.fov=70+shake*6;cam.updateProjectionMatrix();
  shake*=Math.pow(.02,dt);flash*=Math.pow(.01,dt);$('flash').style.opacity=flash;
  if(bloom)bloom.strength=.55+shake*.3;
  comp?comp.render():ren.render(scene,cam)}
requestAnimationFrame(loop);
}
